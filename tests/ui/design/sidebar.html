<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sidebar</title>
    <!-- Replaced at build time with the app's own compiled stylesheet, so what
         this renders is what ships. See scripts/build-gallery.mjs. -->
    <!--APP_CSS-->
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: var(--color-page, #f6f6f7);
        color: var(--color-foreground, #111);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
      }
      .cell {
        background: var(--color-card, #fff);
        border-radius: 16px;
        padding: 16px;
      }
      .cap {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        opacity: 0.5;
        margin-bottom: 10px;
      }
      h2 {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.45;
        margin: 36px 0 14px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .note {
        font-size: 13px;
        opacity: 0.6;
        margin: 0 0 20px;
        max-width: 60ch;
      }
      /* The dashboard sidebar is `fixed`, so the page has to leave room for
         it the way the real layout does. */
      body {
        padding-left: 320px;
      }
      .split {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 32px;
        align-items: start;
      }
      /* Below the sidebar's own breakpoint this reservation is a bug, and it
         was one: 390 - 320 - 32 leaves 38px of column, so the heading rendered
         as "Sideba" against the viewport edge and the body text wrapped to one
         word per line. Every mobile studio shot was taken over that. The
         fixture's own broken layout is not the product's, but a reader cannot
         tell them apart in a PNG, and an audit artifact that needs insider
         knowledge to discount is one that will eventually be misread.
         The real app makes the sidebar a drawer here, so the reservation goes. */
      @media (max-width: 767px) {
        body {
          padding-left: 16px;
          padding-right: 16px;
        }
        .split {
          grid-template-columns: minmax(0, 1fr);
          gap: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./sidebar-app.tsx"></script>
  </body>
</html>
