<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Axis labels</title>
    <!-- Replaced at build time with the app's own compiled stylesheet, so what
         this renders is what ships. See scripts/build-gallery.mjs. -->
    <!--APP_CSS-->
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: var(--color-page, #f6f6f7);
        color: var(--color-foreground, #111);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
      }
      .cell {
        background: var(--color-card, #fff);
        border-radius: 16px;
        padding: 16px;
        /* The specimens state a panel width in pixels, which is the whole
           point of the page — and at 390 the 540px and 1100px ones simply hung
           off the right of the screen, taking 59px of chart with them. A
           reading taken from a specimen wider than the screen showing it is a
           reading of a chart nobody can see. Clamped, so every section renders
           at the width a phone actually gives a panel; on a desktop, where the
           stated widths fit, nothing changes. */
        max-width: 100%;
      }
      .cap {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        opacity: 0.5;
        margin-bottom: 10px;
      }
      h2 {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.45;
        margin: 36px 0 14px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .note {
        font-size: 13px;
        opacity: 0.6;
        margin: 0 0 24px;
        max-width: 60ch;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: start;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./labels-app.tsx"></script>
  </body>
</html>
