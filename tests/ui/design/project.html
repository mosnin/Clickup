<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project screen</title>
    <!-- Replaced at build time with the app's own compiled stylesheet, so what
         this renders is what ships. See scripts/build-gallery.mjs. -->
    <!--APP_CSS-->
    <style>
      /* No page frame of any kind. Like home.html and unlike every specimen
         sheet here, this is the PRODUCT: the shell, its padding and the width
         the screen lays out in all come from the app's own components, because
         a frame invented here would change the one measurement a screenshot of
         this surface is taken to answer. */
      body {
        margin: 0;
        background: var(--color-page, #f6f6f7);
        color: var(--color-foreground, #111);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./project-app.tsx"></script>
  </body>
</html>
